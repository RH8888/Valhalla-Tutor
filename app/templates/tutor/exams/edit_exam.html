{% extends "base.html" %}
{% block title %}Edit Exam Definition - Valhalla Tutor{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="border-b border-slate-200 pb-4">
        <a href="/tutor/exams" class="text-sm text-slate-500 hover:text-slate-800 transition">&larr; Back to Exams</a>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 mt-2">Edit Exam Definition</h1>
        <p class="text-sm text-slate-500 mt-1">Modify name or archive/deactivate this reusable exam.</p>
    </div>

    {% if error %}
        <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/tutor/exams/{{ exam.id }}/edit" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
        <input type="hidden" name="csrf_token" value="{{ current_session.csrf_token if current_session else '' }}">

        <div>
            <label for="title" class="block text-sm font-semibold text-slate-700">Exam Title / Name *</label>
            <input type="text" id="title" name="title" value="{{ exam.title }}" required
                   class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div>
            <label for="description" class="block text-sm font-semibold text-slate-700">Description (Optional)</label>
            <textarea id="description" name="description" rows="3"
                      class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">{{ exam.description or '' }}</textarea>
        </div>

        <div class="flex items-center space-x-3">
            <input type="checkbox" id="is_active" name="is_active" value="true" {% if exam.is_active %}checked{% endif %}
                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded">
            <label for="is_active" class="text-sm font-medium text-slate-700">Exam is active (uncheck to archive / deactivate)</label>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
            <a href="/tutor/exams" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition">Cancel</a>
            <button type="submit" class="px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition">Update Exam</button>
        </div>
    </form>
</div>
{% endblock %}
