{% extends "base.html" %}

{% block title %}Edit Subject: {{ subject.name }} &mdash; Valhalla Tutor{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Edit Subject</h1>
            <p class="text-sm text-slate-500 mt-1">Modify subject details.</p>
        </div>
        <a href="/tutor/subjects" class="text-sm font-semibold text-slate-600 hover:text-slate-900">&larr; Back to Subjects</a>
    </div>

    {% if error %}
        <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <form method="POST" action="/tutor/subjects/{{ subject.id }}/edit" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ current_session.csrf_token if current_session else '' }}">
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-700">Subject Name *</label>
                <input type="text" id="name" name="name" required value="{{ subject.name }}"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm">
            </div>
            <div>
                <label for="description" class="block text-xs font-semibold text-slate-700">Description</label>
                <textarea id="description" name="description" rows="3"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm">{{ subject.description or '' }}</textarea>
            </div>
            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <a href="/tutor/subjects" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50 transition">Cancel</a>
                <button type="submit" class="py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-sm transition">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
