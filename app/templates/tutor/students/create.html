{% extends "base.html" %}

{% block title %}Create Student Account &mdash; Valhalla Tutor{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">Add New Student</h1>
        <a href="/tutor/students" class="text-sm font-semibold text-slate-600 hover:text-slate-900">&larr; Back to Directory</a>
    </div>

    {% if error %}
        <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200">
        <form method="POST" action="/tutor/students" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ current_session.csrf_token if current_session else '' }}">

            <div>
                <label for="full_name" class="block text-sm font-semibold text-slate-700">Full Name</label>
                <input type="text" id="full_name" name="full_name" required value="{{ full_name or '' }}"
                    placeholder="e.g. Ali Rezaei"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base sm:text-sm">
            </div>

            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700">Username</label>
                <input type="text" id="username" name="username" required value="{{ username or '' }}"
                    placeholder="e.g. alirezaei"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base sm:text-sm">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700">Email Address <span class="text-slate-400 font-normal">(optional)</span></label>
                <input type="email" id="email" name="email" value="{{ email or '' }}"
                    placeholder="e.g. ali@example.com"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base sm:text-sm">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700">Initial Password</label>
                <input type="password" id="password" name="password" required
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base sm:text-sm">
            </div>

            <div>
                <label for="grade" class="block text-sm font-semibold text-slate-700">Academic Grade <span class="text-red-500">*</span></label>
                <select id="grade" name="grade" required
                    class="mt-1 block w-full px-3 py-2.5 sm:py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base sm:text-sm bg-white min-h-[42px]">
                    <option value="">-- Select Academic Grade --</option>
                    <option value="10" {% if grade == '10' %}selected{% endif %}>Grade 10</option>
                    <option value="11" {% if grade == '11' %}selected{% endif %}>Grade 11</option>
                    <option value="12" {% if grade == '12' %}selected{% endif %}>Grade 12</option>
                </select>
                <p class="text-xs text-slate-500 mt-1">Used to filter courses, books, and study plan assignments.</p>
            </div>

            <div>
                <label for="timezone" class="block text-sm font-semibold text-slate-700">Timezone</label>
                <input type="text" id="timezone" name="timezone" value="{{ timezone or 'Asia/Tehran' }}"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base sm:text-sm">
            </div>

            <div class="pt-2 flex flex-col sm:flex-row justify-end gap-3 sm:space-x-3">
                <a href="/tutor/students" class="min-h-[44px] flex items-center justify-center px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50 transition w-full sm:w-auto text-center">
                    Cancel
                </a>
                <button type="submit" class="min-h-[44px] flex items-center justify-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-sm transition w-full sm:w-auto">
                    Create Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
