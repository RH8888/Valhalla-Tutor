{% extends "base.html" %}

{% block title %}Create Test Book &mdash; Valhalla Tutor{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Create Test Book</h1>
            <p class="text-sm text-slate-500 mt-1">Register a test book under an academic subject.</p>
        </div>
        <a href="/tutor/books" class="text-sm font-semibold text-slate-600 hover:text-slate-900">&larr; Back to Books</a>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <form method="POST" action="/tutor/books" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ current_session.csrf_token if current_session else '' }}">
            <div>
                <label for="subject_id" class="block text-xs font-semibold text-slate-700">Subject *</label>
                <select id="subject_id" name="subject_id" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">-- Select Subject --</option>
                    {% for s in subjects %}
                        <option value="{{ s.id }}" {% if selected_subject_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="title" class="block text-xs font-semibold text-slate-700">Book Title *</label>
                <input type="text" id="title" name="title" required placeholder="e.g. زیست‌شناسی جامع خیلی سبز"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="grade" class="block text-xs font-semibold text-slate-700">Grade Level *</label>
                <input type="text" id="grade" name="grade" required placeholder="e.g. دهم, یازدهم, دوازدهم, جامع کنکور"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="description" class="block text-xs font-semibold text-slate-700">Description (Optional)</label>
                <textarea id="description" name="description" rows="3"
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></textarea>
            </div>
            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <a href="/tutor/books" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50 transition">Cancel</a>
                <button type="submit" class="py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-sm transition">
                    Create Book
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
