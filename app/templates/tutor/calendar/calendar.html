{% extends "base.html" %}

{% block title %}Calendar &mdash; Valhalla Tutor{% endblock %}

{% block content %}
<div class="space-y-6" id="calendar-root">
    <!-- Header Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex items-center space-x-4">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900" id="calendar-title">{{ cal.title }}</h1>
            <div class="inline-flex rounded-lg border border-slate-200 bg-slate-50 p-0.5 text-xs font-semibold">
                <a href="/tutor/calendar?view=month&date={{ cal.current_date.strftime('%Y-%m-%d') }}"
                   hx-get="/tutor/calendar?view=month&date={{ cal.current_date.strftime('%Y-%m-%d') }}"
                   hx-target="#calendar-view-container"
                   hx-push-url="true"
                   class="px-3 py-1.5 rounded-md transition {% if view == 'month' %}bg-white text-indigo-700 shadow-xs{% else %}text-slate-600 hover:text-slate-900{% endif %}">
                    Month
                </a>
                <a href="/tutor/calendar?view=week&date={{ cal.current_date.strftime('%Y-%m-%d') }}"
                   hx-get="/tutor/calendar?view=week&date={{ cal.current_date.strftime('%Y-%m-%d') }}"
                   hx-target="#calendar-view-container"
                   hx-push-url="true"
                   class="px-3 py-1.5 rounded-md transition {% if view == 'week' %}bg-white text-indigo-700 shadow-xs{% else %}text-slate-600 hover:text-slate-900{% endif %}">
                    Week
                </a>
                <a href="/tutor/calendar?view=day&date={{ cal.current_date.strftime('%Y-%m-%d') }}"
                   hx-get="/tutor/calendar?view=day&date={{ cal.current_date.strftime('%Y-%m-%d') }}"
                   hx-target="#calendar-view-container"
                   hx-push-url="true"
                   class="px-3 py-1.5 rounded-md transition {% if view == 'day' %}bg-white text-indigo-700 shadow-xs{% else %}text-slate-600 hover:text-slate-900{% endif %}">
                    Day
                </a>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <div class="inline-flex items-center space-x-1 border border-slate-200 rounded-lg p-1 bg-white">
                <a href="/tutor/calendar?view={{ view }}&date={{ cal.prev_date }}"
                   hx-get="/tutor/calendar?view={{ view }}&date={{ cal.prev_date }}"
                   hx-target="#calendar-view-container"
                   hx-push-url="true"
                   class="p-1.5 rounded hover:bg-slate-100 text-slate-600 hover:text-slate-900 transition"
                   title="Previous">
                    &larr; Prev
                </a>
                <a href="/tutor/calendar?view={{ view }}&date={{ cal.today_date }}"
                   hx-get="/tutor/calendar?view={{ view }}&date={{ cal.today_date }}"
                   hx-target="#calendar-view-container"
                   hx-push-url="true"
                   class="px-2.5 py-1 text-xs font-semibold rounded hover:bg-slate-100 text-slate-700 transition">
                    Today
                </a>
                <a href="/tutor/calendar?view={{ view }}&date={{ cal.next_date }}"
                   hx-get="/tutor/calendar?view={{ view }}&date={{ cal.next_date }}"
                   hx-target="#calendar-view-container"
                   hx-push-url="true"
                   class="p-1.5 rounded hover:bg-slate-100 text-slate-600 hover:text-slate-900 transition"
                   title="Next">
                    Next &rarr;
                </a>
            </div>

            <button type="button"
                    hx-get="/tutor/meetings/new?date={{ cal.current_date.strftime('%Y-%m-%d') }}"
                    hx-target="#modal-container"
                    class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition">
                + Schedule Meeting
            </button>
        </div>
    </div>

    <!-- Calendar View Container -->
    <div id="calendar-view-container"
         hx-get="/tutor/calendar?view={{ view }}&date={{ cal.current_date.strftime('%Y-%m-%d') }}"
         hx-trigger="meetingChanged from:body"
         hx-target="#calendar-view-container">
        {% include "tutor/calendar/partials/" ~ view ~ "_view.html" %}
    </div>

    <!-- Modal Container for Create/Edit/Details -->
    <div id="modal-container"></div>
</div>
{% endblock %}
