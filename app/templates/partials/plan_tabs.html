{# Student Study Plan Hub Tabs #}
<div class="border-b border-slate-200 mb-6 pb-0">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 gap-2">
        <div>
            <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 block">{{ _('Study Planning Hub') }}</span>
            <h2 class="text-xl font-black text-slate-900 tracking-tight">{{ _('14-Day Study Plans & History') }}</h2>
        </div>
        <a href="/student/dashboard" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-slate-800 transition">
            <svg class="w-3.5 h-3.5 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            <span>{{ _('back_to_dashboard') }}</span>
        </a>
    </div>
    <nav class="-mb-px flex gap-3 sm:gap-6 overflow-x-auto pb-0.5 scrollbar-none" style="-webkit-overflow-scrolling: touch;">
        <a href="/student/plan"
           class="py-2.5 px-1 inline-flex items-center gap-1.5 sm:gap-2 border-b-2 text-xs sm:text-sm font-semibold whitespace-nowrap transition {% if active_plan_tab == 'active' %}border-indigo-600 text-indigo-600{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300{% endif %}">
            <span>🎯</span>
            <span>{{ _('Current 14-Day Plan') }}</span>
        </a>
        <a href="/student/plans/history"
           class="py-2.5 px-1 inline-flex items-center gap-1.5 sm:gap-2 border-b-2 text-xs sm:text-sm font-semibold whitespace-nowrap transition {% if active_plan_tab == 'history' %}border-indigo-600 text-indigo-600{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300{% endif %}">
            <span>🗂️</span>
            <span>{{ _('Plan Archives') }}</span>
        </a>
        <a href="/student/history"
           class="py-2.5 px-1 inline-flex items-center gap-1.5 sm:gap-2 border-b-2 text-xs sm:text-sm font-semibold whitespace-nowrap transition {% if active_plan_tab == 'completion' %}border-indigo-600 text-indigo-600{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300{% endif %}">
            <span>📜</span>
            <span>{{ _('Task Completion Log') }}</span>
        </a>
    </nav>
</div>
