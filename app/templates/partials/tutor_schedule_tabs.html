{# Tutor Schedule Hub Tabs #}
<div class="border-b border-slate-200 mb-6 pb-0">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 gap-2">
        <div>
            <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 block">{{ _('schedule') }}</span>
            <h2 class="text-xl font-black text-slate-900 tracking-tight">{{ _('Meetings & Availability') }}</h2>
        </div>
    </div>
    <nav class="-mb-px flex gap-3 sm:gap-6 overflow-x-auto pb-0.5 scrollbar-none" style="-webkit-overflow-scrolling: touch;">
        <a href="/tutor/calendar"
           class="py-2.5 px-1 inline-flex items-center gap-1.5 sm:gap-2 border-b-2 text-xs sm:text-sm font-semibold whitespace-nowrap transition {% if active_tab == 'calendar' %}border-indigo-600 text-indigo-600{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300{% endif %}">
            <span>📅</span>
            <span>{{ _('Calendar & Meetings') }}</span>
        </a>
        <a href="/tutor/scheduler"
           class="py-2.5 px-1 inline-flex items-center gap-1.5 sm:gap-2 border-b-2 text-xs sm:text-sm font-semibold whitespace-nowrap transition {% if active_tab == 'scheduler' %}border-indigo-600 text-indigo-600{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300{% endif %}">
            <span>⏰</span>
            <span>{{ _('Weekly Availability') }}</span>
        </a>
    </nav>
</div>
